version: "3.8"

services:

  app:
    image: react-app:latest
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - app-network


networks:
  app-network:
    driver: bridge
